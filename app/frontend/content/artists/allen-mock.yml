name: Allen Mock
location: Tokyo, Japan
bio:
  en: >-
    Allen Mock is a Tokyo-based producer and DJ whose work spans future bass and
    trap, with influences from melodic dubstep. He also explores hybrid trap and
    bass house. His releases and DJ sets bring together original productions,
    edits, remixes, and VIP versions.
  ja: >-
    Allen Mockは東京を拠点に活動するプロデューサー／DJです。Future BassやTrapを軸に、
    メロディック・ダブステップの影響を取り入れたサウンドを制作しています。
    Hybrid TrapやBass Houseにも取り組み、オリジナル作品やリミックスなどをDJセットで披露しています。
