name: Stefan
role:
  en: Artist & founder
  ja: アーティスト・創設者
location:
  en: Tokyo · Da Nang
  ja: 東京・ダナン
tagline:
  en: Never stop fighting for your place in the world.
  ja: 自分の居場所をつかむために、闘い続ける。
bio:
  en: >-
    Stefan is a bass music enthusiast based in Da Nang, Vietnam. In 2014 he
    founded New Sound For Japan, a brand that is now dormant. Follow The Bass
    is its spiritual successor.
  ja: >-
    Stefanはベトナム・ダナンを拠点とするベースミュージック愛好家です。2014年に
    「New Sound For Japan」を立ち上げ、現在は休止中。Follow The Bassはその精神を
    受け継ぐブランドです。
links:
  - label: Instagram · @buhrmi
    url: https://instagram.com/buhrmi
  - label: Twitch · followthebass
    url: https://twitch.tv/followthebass
interview:
  en:
    - question: What was New Sound For Japan?
      answer: >-
        It was the name I used to bring international bass artists to Tokyo
        between 2014 and 2016. I handled the agents, the flights, the visas, the
        fees and the room — and paid for most of it myself. In 2016 I brought
        Far Too Loud over together with Tokyo Bass Music and co-produced the
        Tokyo date with them.
      link:
        label: Tokyo Bass Conference feat. Far Too Loud
        url: /en/shows/far-too-loud
    - question: Why Follow The Bass?
      answer: >-
        Because recognition is something you claim, not something you wait to be
        handed. For those years I did the work behind other people’s names — the
        agents, the visas, the flights, the room — and I was fine with that,
        because the night mattered more than the credit. But a track record
        nobody can find is worth nothing, to me or to the artists. So I am
        putting my own name on my own work: Follow The Bass.
    - question: Isn't this just about getting your name on a flyer?
      answer: >-
        Recognition is not vanity, it is infrastructure. If the person who
        produced the night is invisible, the next artist cannot find them and
        the next venue cannot check them. A name on the flyer is the smallest
        unit of trust there is.
    - question: Why did New Sound For Japan go dormant?
      answer: >-
        I put on a handful of shows under that name. The Far Too Loud show was
        the only one that worked. So I let the brand rest instead of dragging it
        behind me. It has been quiet since — until now, which is when it finally
        felt like the right time to try again.
      link:
        label: Tokyo Bass Conference feat. Far Too Loud
        url: /en/shows/far-too-loud
    - question: What does Follow The Bass do differently?
      answer: >-
        I don't do the booking myself — the booking companies we work with do
        that, and they bring us in for the visa, the travel and the venue. What
        changes is what we carry: the brand who carries the cost is the brand
        whose name is on it. Visas, flights, lodging and artist fees are ours,
        not the artist's, and nobody sells tickets to their friends to get on a
        bill. If a night loses money, that is our risk — not the venue's and
        not the artist's.
    - question: What are you doing in Da Nang?
      answer: >-
        Learning a scene from the outside again. When there is no venue and no
        budget, I take a speaker and a controller to the promenade and play
        anyway — those sets are streamed live on Twitch. Same job as 2014, less
        paperwork.
  ja:
    - question: New Sound For Japanとは何だったのですか？
      answer: >-
        2014年から2016年にかけて、海外のベースミュージックアーティストを東京に
        招くために使っていた名前です。エージェントとの調整、航空券、ビザ、出演料、
        宿泊先まで、ほとんどを自分で手配し、費用も負担しました。2016年にはTokyo
        Bass Musicと一緒にFar Too Loudを招聘し、東京公演を共同制作しました。
      link:
        label: Tokyo Bass Conference feat. Far Too Loud
        url: /shows/far-too-loud
    - question: なぜFollow The Bassなのですか？
      answer: >-
        評価は誰かから与えられるのを待つものではなく、自分でつかむものだからです。
        あの数年間、エージェント、ビザ、航空券、宿泊先の手配など、ほかの人の名前の
        裏で仕事をしていました。イベントの夜そのものが評価より大切だったので、
        それで構わないと思っていました。でも、誰にも見つけてもらえない実績は、
        自分にとってもアーティストにとっても意味がありません。だから自分の仕事に
        自分の名前を掲げます。それがFollow The Bassです。
    - question: フライヤーに自分の名前を載せたいだけでは？
      answer: >-
        評価は虚栄ではなく、活動を支える基盤です。イベントを作った人が見えなければ、
        次のアーティストはその人を見つけられず、次の会場も実績を確かめられません。
        フライヤーに名前が載ることは、信頼を築く最小単位です。
    - question: なぜNew Sound For Japanは休止したのですか？
      answer: >-
        その名前でいくつかイベントを開催しましたが、うまくいったのはFar Too Loudの
        公演だけでした。ブランドを無理に引きずるのではなく、休ませることにしました。
        それから静かな状態が続き、今になってようやく、もう一度挑戦する時が来たと
        感じています。
      link:
        label: Tokyo Bass Conference feat. Far Too Loud
        url: /shows/far-too-loud
    - question: Follow The Bassは何が違うのですか？
      answer: >-
        ブッキング自体は自分では行いません。一緒に仕事をするブッキング会社が担当し、
        ビザ、渡航、会場の面で私たちを呼んでくれます。変わるのは、私たちが何を担うか
        です。費用を負担するブランドの名前が、イベントに掲げられます。ビザ、航空券、
        宿泊費、出演料は私たちが負担し、アーティストにチケットを友人へ売らせて出演
        枠を得させることもありません。イベントが赤字になれば、そのリスクは私たちが
        負います。会場やアーティストに負わせることはありません。
    - question: ダナンでは何をしているのですか？
      answer: >-
        外から新しいシーンを学び直しています。会場も予算もない時は、スピーカーと
        コントローラーを持って遊歩道へ行き、そこでプレイします。そのセットはTwitchで
        ライブ配信しています。2014年と同じ仕事を、書類仕事を減らして続けています。
