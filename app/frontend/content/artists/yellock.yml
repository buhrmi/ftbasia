name: YELLOCK
role:
  en: "Virtual human artist · drum'n'bass producer"
  ja: バーチャルヒューマンアーティスト · ドラムンベース・プロデューサー
location:
  en: Tokyo, Japan
  ja: 東京
tagline:
  en: A virtual human artist reshaping drum'n'bass performance.
  ja: リアルとバーチャルの境界を越えるドラムンベース・アーティスト。
bio:
  en: >-
    YELLOCK is a Tokyo-based virtual human artist and drum'n'bass producer
    working at the intersection of dance music and real-time digital
    performance. First introduced as the debut artist on the relaunched 06S
    RECORDS, YELLOCK unveiled a virtual human live at 06S FINAL at WOMB in
    January 2020, pairing a motion-capture-suited performer with a virtual
    avatar moving in real time.

    Since then, YELLOCK has become a core member of the 06S family — described
    by the party as its "young boss" — and has released the albums "Virtual
    Human Being" (2021), "THE EDGES BETWEEN THE LINE" with DJ AKi (2022), and
    "Post Virtual Humanism" (2025), followed by a remix album in 2026. The
    music ranges from hard, fast drum'n'bass to emotional,
    live-instrument-driven sound design, with collaborators including DJ AKi,
    YUUKi MC, TAKEO, MANTARROW, KID DRAMA, AUDIO, SHIMON, Maozon and Glasscat.

    YELLOCK's live work combines 3D/2D visuals, motion capture and virtual
    production, including the XR streaming series "Jupiter A VIRTUAL JOURNEY."
    The artist has performed at 06S and Ultra Music Festival Japan and continues
    to release music and explore new forms of digital performance.
  ja: >-
    YELLOCKは東京を拠点に活動するバーチャルヒューマンアーティスト、ドラムンベース・プロデューサー。ダンスミュージックとリアルタイムのデジタルパフォーマンスを横断しながら、再始動した06S RECORDSの第一弾アーティストとして登場。2020年1月の06S FINAL at WOMBでは、モーションキャプチャスーツを着た人間とバーチャルヒューマンが同時に動くバーチャルヒューマンライブを世界初披露した。

    その後は06Sファミリーの一員として活動し、パーティでは「06Sの若頭」とも称される。2021年に「Virtual Human Being」、2022年にDJ AKiとの「THE EDGES BETWEEN THE LINE」、2025年に「Post Virtual Humanism」をリリースし、2026年にはリミックスアルバムを発表。DJ AKi、YUUKi MC、TAKEO、MANTARROW、KID DRAMA、AUDIO、SHIMON、Maozon、Glasscatらとコラボレーションしている。

    ライブでは3D／2D映像、モーションキャプチャ、バーチャルプロダクションを組み合わせ、XR配信シリーズ「Jupiter A VIRTUAL JOURNEY」も展開。06SやUltra Music Festival Japanなどに出演し、新しい音楽体験を探求し続けている。
