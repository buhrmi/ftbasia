tagline:
  en: Never stop fighting for your place in the world.
  ja: Never stop fighting for your place in the world.
bio:
  en: >-
    buhrmi, known as Stefan in Japan, is a web developer reimagining himself
    as an artist. Now living in Da Nang, he is working to reestablish himself
    as an artist through Twitch and YouTube.
  ja: >-
    日本ではステファンの名前で知られるbuhrmiは、ウェブ開発者として働きながら、
    アーティストとしての自分を再構築しています。現在はダナンに暮らし、Twitchや
    YouTubeを通じてアーティストとしての活動を再び確立することに取り組んでいます。
