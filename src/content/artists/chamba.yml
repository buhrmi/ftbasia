tagline:
  en: A Yamatai Records artist featured in the label's liquid D&B roster.
  ja: Yamatai Recordsのリキッド系D&Bアーティストの一人。
bio:
  en: >-
    CHAMBA is a UK drum & bass artist with releases on Yamatai Records. In a UKF
    label spotlight, Yamatai owner James Williams names Chamba among the artists
    representing the label's liquid drum & bass side. The Bass2Face x Exodus
    Records event listing for Thursday Clash in Da Nang credits CHAMBA with
    Exodus Records and Yamatai Records.
  ja: >-
    CHAMBAはイギリスのドラムンベースアーティスト。Yamatai Recordsから作品を
    リリースしており、UKFのレーベル特集では、同レーベルのオーナーJames Williamsが
    リキッド系ドラムンベースを代表するアーティストの一人としてCHAMBAを挙げている。
    ダナンで開催されるBass2FaceとExodus Recordsのイベント「Thursday Clash」では、
    CHAMBAの所属レーベルとしてExodus RecordsとYamatai Recordsが記載されている。
