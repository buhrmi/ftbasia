name: Stefan
role:
  en: Artist & founder
  ja: アーティスト・創設者
location:
  en: Tokyo · Da Nang
  ja: 東京・ダナン
tagline:
  en: Never stop fighting for your place in the world.
  ja: 自分の居場所をつかむために、闘い続ける。
bio:
  en: >-
    A former web developer, Stefan is now trying his hand at building Follow
    The Bass, a bass music collective based in Da Nang, Vietnam. In 2014 he
    founded New Sound For Japan, a brand that is now dormant. Follow The Bass
    is its spiritual successor.
  ja: >-
    元ウェブ開発者のStefanは現在、ベトナム・ダナンを拠点に、ベースミュージック・
    コレクティブ「Follow The Bass」の立ち上げに挑戦しています。2014年には
    「New Sound For Japan」を立ち上げましたが、現在は休止中です。Follow The Bassは
    その精神を受け継ぐブランドです。
