name: DJ AKi
role:
  en: "Drum'n'bass DJ · 06S resident & organiser"
  ja: ドラムンベースDJ · 06Sレジデント／オーガナイザー
location:
  en: Tokyo, Japan
  ja: 東京
tagline:
  en: "WOMB's longest-running drum'n'bass resident."
  ja: WOMB最長レジデントパーティー「06S」を率いるドラムンベースDJ。
bio:
  en: >-
    DJ AKi is a Tokyo-based drum'n'bass DJ, event producer and the resident
    behind 06S, WOMB's longest-running drum'n'bass party. He began DJing in New
    York in 1996 and returned to Japan to launch 06S at WOMB in 2001. Under his
    direction, the monthly party hosted more than 100 international artists and
    helped shape Tokyo's drum'n'bass scene, running for 207 editions before its
    2020 finale and returning in 2022.

    He founded the label 06S RECORDS in 2006 and later relaunched it. His
    releases and mixes include the 2004 mix CD "New Type Drum+Bass 06S," the
    Nike+ mix "SPEED," and work with ASY, his project with STY and YUUKi MC. He
    has toured in the UK, Brazil, the Netherlands, Austria, Serbia, the Czech
    Republic, the US, Taiwan, Korea, China, Thailand and Singapore, and played
    festivals including FUJI ROCK, ULTRA JAPAN, ULTRA KOREA, Let It Roll and
    WOMB ADVENTURE.

    He continues to organise 06S and RECOMBINATION at WOMB, works as an event
    producer and DJ instructor, and streams regularly on Twitch.
  ja: >-
    DJ AKiは東京を拠点に活動するドラムンベースDJ、イベントプロデューサー。WOMB最長レジデントパーティー「06S」のレジデントを務める。1996年にニューヨークでDJを始め、2001年に東京・WOMBで06Sをスタート。100組以上の海外アーティストを招き、東京のドラムンベースシーンを牽引した。06Sは2020年に一度ファイナルを迎え、2022年に再始動。2006年にはレーベル「06S RECORDS」を設立し、その後リニューアルした。2004年のミックスCD「New Type Drum+Bass 06S」、Nike+のミックス、STYとYUUKi MCとのユニットASYなどの作品を発表。FUJI ROCK、ULTRA JAPAN、ULTRA KOREA、Let It Roll、WOMB ADVENTUREなど国内外のフェスに出演し、イギリス、ブラジル、オランダ、オーストリア、セルビア、チェコ、アメリカ、台湾、韓国、中国、タイ、シンガポールでプレイしている。現在は06SとRECOMBINATIONのオーガナイズを続けながら、イベントプロデューサー、DJ講師としても活動し、Twitchで配信している。
