name: Tha Boogie Bandit
location: Tokyo, Japan
bio:
  en: >-
    Born in Los Angeles and based in Tokyo, Tha Boogie Bandit is a DJ and
    producer in Japan's bass music scene. His sound moves through trap, future
    bass, and bass house. His official biography notes Beatport chart placements
    and official remix work, including remixes for NERVO and Snoop Dogg.
  ja: >-
    ロサンゼルス生まれ、東京を拠点に活動するDJ／プロデューサーです。
    日本のベースミュージックシーンで活動し、Trap、Future Bass、Bass Houseを制作。
    公式プロフィールでは、Beatportでのチャート実績や、NERVO、Snoop Doggなどの公式リミックス作品が紹介されています。
